// ── Interview prep content ───────────────────────────────────────────────────
const PREP = [
  {
    heading: "Read this first: the one-paragraph mental model",
    body: "Two apps talk over HTTP. The React app keeps a token and asks questions; the Express app answers them but only after two separate checks. Check one is authentication — \"is this a real logged-in user?\" — done by verifying the JWT signature. Check two is authorization — \"is this user allowed to do this, in this workspace?\" — done by loading their Member record and comparing their role's permissions against what the endpoint requires. Almost every bug and every interview question lives in the gap between those two checks.",
  },
  {
    heading: "Concept 1 — Multi-tenancy",
    body: "Many separate customers share one database. Isolation comes from a workspaceId on every document plus a membership check before every read. This is the \"pool\" model: cheapest to run, but it depends on discipline — if one endpoint forgets the membership lookup, data leaks across tenants. That tradeoff is the whole reason the Member lookup is the first line of every controller.",
  },
  {
    heading: "Concept 2 — Authentication vs Authorization",
    body: "Authentication proves identity (the JWT). Authorization decides capability (the role). They are different steps in different places: the passport strategy handles the first, roleGuard handles the second. Mixing them up is the most common beginner mistake — a valid token does not mean a valid action.",
  },
  {
    heading: "Concept 3 — Why roles live in their own collection",
    body: "A role is a named bundle of permissions. Storing the bundle once and pointing memberships at it means changing what an Admin can do is a one-document edit, not a migration across every member. The cost is an extra populate on each request.",
  },
  {
    heading: "Concept 4 — Transactions",
    body: "MongoDB writes one document atomically, but not several. A transaction groups multiple writes so they all succeed or all roll back. Signup uses one (User + Account + Workspace + Member), and workspace delete uses one (projects + tasks + members). Note: transactions require a replica set — they do not work on a standalone mongod.",
  },
  {
    heading: "Concept 5 — Server state vs client state",
    body: "Server state is data that lives in the database and can go stale — users, workspaces, tasks. React Query owns it, handling caching, refetching, and invalidation. Client state is purely local — the auth token, dialog open/closed. Zustand owns that. Using one tool for both is what makes codebases messy.",
  },
  { divider: true, heading: "Interview questions worth rehearsing" },
  {
    q: "Walk me through what happens when a user opens the task list.",
    a: "The route guard confirms a user exists, AppLayout mounts AuthProvider which loads the user and the workspace from the URL id. The task table calls the API through the shared axios instance, whose interceptor attaches the Bearer token. On the server the JWT strategy verifies the token and attaches req.user; the task controller resolves the caller's role via getMemberRoleWorkspace, calls roleGuard with VIEW_ONLY, then the service builds the filter query and fetches a page of tasks plus a total count in parallel.",
  },
  {
    q: "How do you stop one workspace from reading another's data?",
    a: "Every scoped document carries a workspaceId, and the workspaceId always comes from the URL — never from the request body, which a client could forge. Before any query runs, getMemberRoleWorkspace throws if the caller has no Member record for that workspace. The honest caveat is that this is per-controller discipline rather than an enforced middleware, so a forgotten call would be a real leak; a workspace-scoped middleware that injects a verified id would be the stronger design.",
  },
  {
    q: "Why is your permission check duplicated on the client and the server?",
    a: "They serve different purposes. The client check is presentation — hide buttons a user can't use so the UI isn't confusing. The server check is security. The client version is trivially bypassable via devtools, so it is never the thing protecting the data. If asked which one you could delete: the client one, at the cost of UX.",
  },
  {
    q: "Where is the JWT stored, and what's the risk?",
    a: "In a Zustand store persisted to sessionStorage. That is readable by JavaScript, so an XSS bug could steal it — the tradeoff being it is immune to CSRF. The alternative, an httpOnly cookie, flips that: safe from XSS, exposed to CSRF unless you add SameSite plus a token. Neither is strictly better; it depends on which threat you consider more likely.",
  },
  {
    q: "How would you revoke a token immediately if an account were compromised?",
    a: "You can't with a plain stateless JWT — it stays valid until it expires. The realistic options are a short access-token lifetime paired with refresh-token rotation, a denylist of revoked token ids checked on each request, or rotating the signing secret to invalidate everything at once. This project currently has none of those, which is a fair thing to name as a known gap.",
  },
  {
    q: "Your task list uses skip and limit. What breaks at scale?",
    a: "Skip is linear — page 500 makes MongoDB walk past ten thousand documents before returning any. Results can also shift or duplicate if a row is inserted while the user pages. Cursor pagination fixes both by remembering the last id and querying for documents greater than it, staying constant-time at any depth. For a task board with modest page counts, skip is a reasonable choice, and knowing why is the point.",
  },
  {
    q: "Which index matters most here?",
    a: "A compound index on Member { userId, workspaceId }, because that lookup runs on essentially every authorized request — unindexed, it is a collection scan per call. After that, the task query fields you filter on most, ordered equality-then-sort-then-range. Also worth flagging: keyword search uses a regex on title, which can't use a normal index efficiently and would want a text index.",
  },
  {
    q: "Tell me about a bug or weak spot you found in your own code.",
    a: "Two worth naming. Signup writes three collections without a transaction while delete uses one — an inconsistency that could leave a user with no membership. And the email/password path returns a token without storing it the way the Google path does, so the two login flows don't behave identically. Finding these while reading your own code is a better answer than claiming there aren't any.",
  },
  {
    q: "What would you add first if this went to production?",
    a: "Rate limiting on login, because brute force is the cheapest attack available. Then a test suite around roleGuard and the membership lookup, since those two functions are pure, are what all security depends on, and are trivial to test. Then refresh-token rotation. Real-time updates would be more fun to build but none of those three are optional.",
  },
];

let HIGHLIGHTED = {};

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current)
      canvasRef.current.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    if (zoomDisplayRef.current)
      zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current && canvasRef.current.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = svg.getBoundingClientRect().width / s.zoom;
    const sh = svg.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.15, Math.min(2, Math.min((vw - 80) / sw, (vh - 80) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top, s = st.current;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.15, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (e) => {
      if (e.target.closest && e.target.closest('.node')) return;
      drag.current = { on: true, lx: e.clientX, ly: e.clientY };
      try { vp.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const onMove = (e) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += e.clientX - d.lx; st.current.panY += e.clientY - d.ly;
      d.lx = e.clientX; d.ly = e.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.15, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

function MermaidDiagram({ onNodeClick }) {
  const ref = useRef(null);
  useEffect(() => {
    window.nodeClickHandler = onNodeClick;
    mermaid.initialize({
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: Object.assign({}, MERMAID_THEME, {
        secondaryColor: '#000000', tertiaryColor: '#000000',
        mainBkg: '#0a0a0a', nodeBorder: '#2a2a2a',
        clusterBkg: 'rgba(10,10,10,0.8)', clusterBorder: '#7c3aed',
        titleColor: '#ffffff', edgeLabelBackground: 'transparent',
      }),
      flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
    });
    mermaid.render('walkthrough-diagram', DIAGRAM).then(({ svg, bindFunctions }) => {
      if (ref.current) { ref.current.innerHTML = svg; if (bindFunctions) bindFunctions(ref.current); }
    }).catch((err) => {
      if (ref.current) ref.current.innerHTML = '<pre style="color:#ef4444">' + String(err) + '</pre>';
    });
    return () => { delete window.nodeClickHandler; };
  }, [onNodeClick]);
  return h('div', { ref, className: 'mermaid-wrap' });
}

    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  const codeHtml = HIGHLIGHTED[nodeId];
  return h('div', {
    className: 'fixed top-4 right-4 bottom-4 w-[560px] max-w-[92vw] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-5 dt-scroll' },
      h('h2', { className: 'text-lg font-bold text-wt-fg mb-3 pr-9' }, node.title),
      h('div', { className: 'dt-body' }, h('p', null, node.description)),
      node.code ? h('div', { className: 'dt-body' },
        codeHtml
          ? h('div', { dangerouslySetInnerHTML: { __html: codeHtml } })
          : h('pre', { className: 'code-fallback' }, h('code', null, node.code))
      ) : null,
      node.files && node.files.length > 0
        ? h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
            h('div', { className: 'text-[0.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-1.5' }, 'Files'),
            h('code', { className: 'text-sm text-wt-file font-mono leading-relaxed' },
              node.files.map((f, i) => h('span', { key: i }, f, h('br')))
            )
          )
        : null
    )
  );
}

function PrepPanel({ onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return h('div', {
    className: 'fixed top-4 left-4 bottom-4 w-[600px] max-w-[92vw] z-40 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-6 prep-scroll' },
      h('h2', { className: 'text-xl font-bold text-wt-fg mb-1 pr-9' }, 'Concepts & Interview Prep'),
      h('p', { className: 'text-xs text-wt-muted mb-5' }, 'Beginner concepts first, then the questions an SDE 1 panel actually asks about this project.'),
      PREP.map((item, i) => {
        if (item.divider) {
          return h('div', { key: i, className: 'mt-7 mb-4 pt-5 border-t border-wt-border' },
            h('h3', { className: 'text-sm font-bold text-wt-accent uppercase tracking-wider' }, item.heading)
          );
        }
        if (item.q) {
          return h('div', { key: i, className: 'mb-5' },
            h('p', { className: 'text-[0.92rem] font-semibold text-wt-fg mb-1.5 leading-snug' }, item.q),
            h('p', { className: 'text-[0.85rem] text-wt-muted leading-relaxed' }, item.a)
          );
        }
        return h('div', { key: i, className: 'mb-5' },
          h('h3', { className: 'text-[0.92rem] font-semibold text-wt-fg mb-1.5' }, item.heading),
          h('p', { className: 'text-[0.85rem] text-wt-muted leading-relaxed' }, item.body)
        );
      })
    )
  );
}

function App() {
  const [activeId, _setActiveId] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const [prepOpen, setPrepOpen] = useState(false);
  const [, forceTick] = useState(0);
  const pz = usePanZoom();

  const setActiveNode = useCallback((nodeId) => {
    if (!NODES[nodeId]) return;
    _setActiveId(nodeId);
    document.querySelectorAll('.mermaid-wrap .node').forEach((n) => { n.style.opacity = '0.4'; });
    const el = document.querySelector('.mermaid-wrap .node[id*="' + nodeId + '"]');
    if (el) el.style.opacity = '1';
  }, []);

  const closeDetail = useCallback(() => {
    _setActiveId(null);
    document.querySelectorAll('.mermaid-wrap .node').forEach((n) => { n.style.opacity = '1'; });
  }, []);

  useEffect(() => {
    const t = setTimeout(pz.fitToScreen, 700);
    return () => clearTimeout(t);
  }, [pz.fitToScreen]);

  useEffect(() => {
    createHighlighter({ themes: ['vitesse-dark'], langs: ['typescript'] })
      .then((hl) => {
        const out = {};
        Object.keys(NODES).forEach((k) => {
          const n = NODES[k];
          try { out[k] = hl.codeToHtml(n.code, { lang: n.lang || 'typescript', theme: 'vitesse-dark' }); }
          catch (_) {}
        });
        HIGHLIGHTED = out;
        forceTick((x) => x + 1);
      })
      .catch(() => {});
  }, []);

  return h(React.Fragment, null,
    h('header', { className: 'fixed top-0 inset-x-0 z-20 px-6 py-3.5 bg-gradient-to-b from-wt-bg via-wt-bg/90 to-transparent pointer-events-none' },
      h('h1', { className: 'text-base font-semibold text-wt-fg' }, 'TeamForge — How It Works'),
      h('p', { className: 'text-sm text-wt-muted mt-0.5' }, 'A beginner map of the multi-tenant workspace, auth, and permission flow')
    ),
    h('button', {
      onClick: () => setPrepOpen(true),
      className: 'fixed top-4 right-4 z-20 px-3.5 py-2 text-xs font-semibold rounded-lg border border-wt-accent/50 bg-wt-accent/15 text-wt-fg hover:bg-wt-accent/30 transition-colors',
    }, '📘  Concepts & Interview Prep'),

    h('div', {
      ref: pz.viewportRef,
      className: 'fixed inset-0 overflow-hidden cursor-grab active:cursor-grabbing',
    },
      h('div', { ref: pz.canvasRef, className: 'origin-top-left' },
        h(MermaidDiagram, { onNodeClick: setActiveNode })
      )
    ),

    h(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed((c) => !c) }),

    h('div', { className: 'fixed bottom-5 left-6 z-20 flex items-center gap-1.5' },
      h('button', { onClick: pz.zoomOut, className: 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised transition-colors' }, '−'),
      h('span', { ref: pz.zoomDisplayRef, className: 'px-2 text-xs text-wt-muted font-mono w-12 text-center' }, '100%'),
      h('button', { onClick: pz.zoomIn, className: 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised transition-colors' }, '+'),
      h('button', { onClick: pz.fitToScreen, className: 'ml-1 px-2.5 h-8 text-xs rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised transition-colors' }, 'Fit')
    ),

    h('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex flex-wrap justify-center gap-x-4 gap-y-1.5 px-4 py-2 bg-wt-surface/70 backdrop-blur border border-wt-border rounded-lg' },
      LEGEND.map((l, i) => h('div', { key: i, className: 'flex items-center gap-1.5' },
        h('span', { className: 'w-2.5 h-2.5 rounded-sm ' + l.color }),
        h('span', { className: 'text-[0.68rem] text-wt-muted' }, l.label)
      ))
    ),

    h('div', { className: 'fixed bottom-5 right-6 z-20 text-[0.65rem] text-wt-muted/60' },
      'scroll = zoom · drag = pan · click a box for details'),

    activeId && NODES[activeId]
      ? h(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail })
      : null,

    prepOpen ? h(PrepPanel, { onClose: () => setPrepOpen(false) }) : null
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
