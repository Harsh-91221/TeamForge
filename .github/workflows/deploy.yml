name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build project
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          FRONTEND_GOOGLE_CALLBACK_URL: https://harsh-91221.github.io/TeamForge/

      - name: Copy documentation to dist
        run: |
          echo "Current directory: $(pwd)"
          echo "Checking for docs folder..."
          ls -la
          if [ -d "docs" ]; then
            echo "Found docs folder, copying files..."
            ls -la docs/
            cp -r docs/* ./frontend/dist/
            echo "Files copied successfully"
            ls -la ./frontend/dist/
          else
            echo "ERROR: docs folder not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

