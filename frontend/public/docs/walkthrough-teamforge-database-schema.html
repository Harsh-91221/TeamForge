const SUMMARY = "TeamForge has 7 MongoDB collections linked by 10 foreign-key relationships. The central entity is Member — a join table connecting User + Workspace + Role — which is both the tenant boundary (prevents cross-workspace data leaks) and the RBAC source (each Role holds a named list of permissions). Everything else nests under Workspace: Projects hold Tasks, and both carry a direct workspace FK for fast tenant-scoped queries.";

const MERMAID_THEME = {
  primaryColor: '#0a0a0a', primaryTextColor: '#ffffff', primaryBorderColor: '#2a2a2a',
  lineColor: '#a0a0a0', background: '#000000',
};

function usePanZoom() {
  const viewportRef = useRef(null), canvasRef = useRef(null), zoomDisplayRef = useRef(null);
  const st = useRef({ zoom: 1, panX: 0, panY: 0 });
  const drag = useRef({ on: false, lx: 0, ly: 0 });

  const apply = useCallback(() => {
    const { zoom, panX, panY } = st.current;
    if (canvasRef.current)
      canvasRef.current.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    if (zoomDisplayRef.current)
      zoomDisplayRef.current.textContent = Math.round(zoom * 100) + '%';
  }, []);

  const fitToScreen = useCallback(() => {
    const svg = canvasRef.current && canvasRef.current.querySelector('svg');
    const vp = viewportRef.current;
    if (!svg || !vp) return;
    const s = st.current;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sw = svg.getBoundingClientRect().width / s.zoom;
    const sh = svg.getBoundingClientRect().height / s.zoom;
    const fit = Math.max(0.1, Math.min(2, Math.min((vw - 80) / sw, (vh - 80) / sh)));
    s.zoom = fit; s.panX = (vw - sw * fit) / 2; s.panY = (vh - sh * fit) / 2;
    apply();
  }, [apply]);

  useEffect(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top, s = st.current;
      const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const nz = Math.min(4, Math.max(0.1, s.zoom * f)), sc = nz / s.zoom;
      s.panX = mx - sc * (mx - s.panX); s.panY = my - sc * (my - s.panY); s.zoom = nz;
      apply();
    };
    const onDown = (e) => {
      if (e.target.closest && (e.target.closest('.node') || e.target.closest('.entityLabel'))) return;
      drag.current = { on: true, lx: e.clientX, ly: e.clientY };
      try { vp.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const onMove = (e) => {
      const d = drag.current; if (!d.on) return;
      st.current.panX += e.clientX - d.lx; st.current.panY += e.clientY - d.ly;
      d.lx = e.clientX; d.ly = e.clientY; apply();
    };
    const onUp = () => { drag.current.on = false; };
    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    window.addEventListener('resize', fitToScreen);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('pointerdown', onDown);
      vp.removeEventListener('pointermove', onMove);
      vp.removeEventListener('pointerup', onUp);
      vp.removeEventListener('pointercancel', onUp);
      window.removeEventListener('resize', fitToScreen);
    };
  }, [apply, fitToScreen]);

  const zoomIn = useCallback(() => { st.current.zoom = Math.min(4, st.current.zoom * 1.25); apply(); }, [apply]);
  const zoomOut = useCallback(() => { st.current.zoom = Math.max(0.1, st.current.zoom / 1.25); apply(); }, [apply]);
  return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
}

// ─────────────────────────────────────────────────────────────────────────────
// Mermaid ER Diagram
// ─────────────────────────────────────────────────────────────────────────────

function MermaidDiagram({ onEntityClick }) {
  const ref = useRef(null);
  useEffect(() => {
    window.entityClickHandler = onEntityClick;
    mermaid.initialize({
      startOnLoad: false, theme: 'dark', securityLevel: 'loose',
      themeVariables: Object.assign({}, MERMAID_THEME, {
        secondaryColor: '#000000', tertiaryColor: '#000000',
        mainBkg: '#0a0a0a', nodeBorder: '#2a2a2a',
        clusterBkg: 'rgba(10,10,10,0.8)', clusterBorder: '#7c3aed',
        titleColor: '#ffffff', edgeLabelBackground: 'transparent',
        lineColor: '#a0a0a0',
      }),
      er: { useMaxWidth: false },
    });
    mermaid.render('er-diagram', ER_DIAGRAM).then(({ svg, bindFunctions }) => {
      if (ref.current) { ref.current.innerHTML = svg; if (bindFunctions) bindFunctions(ref.current); }
      // Attach click handlers to entity labels
      if (ref.current) {
        ref.current.querySelectorAll('.entityLabel').forEach((el) => {
          el.style.cursor = 'pointer';
          el.addEventListener('click', (e) => {
            const text = el.textContent?.trim().toLowerCase();
            if (text && window.entityClickHandler) window.entityClickHandler(text);
          });
        });
      }
    }).catch((err) => {
      if (ref.current) ref.current.innerHTML = '<pre style="color:#ef4444">' + String(err) + '</pre>';
    });
    return () => { delete window.entityClickHandler; };
  }, [onEntityClick]);
  return h('div', { ref, className: 'mermaid-wrap' });
}

// Panels

function Summary({ collapsed, onToggle }) {
  if (collapsed) {
    return h('div', {
      onClick: onToggle,
      className: 'fixed top-20 left-6 z-10 px-3 py-1.5 bg-wt-surface/60 backdrop-blur border border-wt-border rounded-full shadow-lg cursor-pointer hover:bg-wt-surface/80 transition-all duration-300',
    }, h('span', { className: 'text-xs text-wt-muted font-medium' }, 'ℹ️ Summary'));
  }
  return h('div', {
    onClick: onToggle,
    className: 'fixed top-20 left-6 z-10 max-w-lg px-4 py-3 bg-wt-surface/80 backdrop-blur border border-wt-border rounded-lg shadow-lg cursor-pointer transition-all duration-300',
  },
    h('p', { className: 'text-sm text-wt-muted leading-relaxed' }, SUMMARY),
    h('p', { className: 'text-[0.65rem] text-wt-muted/50 mt-1.5' }, 'Click to dismiss')
  );
}

function FieldTag({ tag }) {
  if (!tag) return null;
  const cls = tag === 'PK' ? 'pk' : tag === 'FK' ? 'fk' : tag === 'UK' ? 'uk' : '';
  return h('span', { className: 'text-[0.65rem] font-bold ml-1 ' + cls }, tag);
}

function EntityDetailPanel({ entityKey, entity, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  let enums = [];
  if (entityKey === 'roles')     enums = ROLES;
  if (entityKey === 'accounts')  enums = PROVIDERS;
  if (entityKey === 'tasks')     enums = [...TASK_STATUS, ...TASK_PRIORITY];

  return h('div', {
    className: 'fixed top-4 right-4 bottom-4 w-[600px] max-w-[92vw] z-30 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-5 dt-scroll' },
      h('div', { className: 'flex items-baseline gap-2 mb-3 pr-9' },
        h('h2', { className: 'text-lg font-bold text-wt-fg' }, entity.title),
        h('span', { className: 'text-xs text-wt-muted font-mono' }, 'Model')
      ),
      h('p', { className: 'text-sm text-wt-muted leading-relaxed mb-4' }, entity.description),

      h('div', { className: 'mb-3' },
        h('div', { className: 'text-[0.68rem] uppercase tracking-wider text-wt-accent font-semibold mb-2' }, 'Fields'),
        h('table', { className: 'field-table' },
          h('thead', null,
            h('tr', null,
              h('th', null, 'Field'),
              h('th', null, 'Type'),
              h('th', null, 'Notes'),
            )
          ),
          h('tbody', null,
            entity.fields.map((f, i) => h('tr', { key: i },
              h('td', null, f.name, h(FieldTag, { tag: f.tag })),
              h('td', null, f.type),
              h('td', null, f.note || ''),
            ))
          )
        )
      ),

      enums.length > 0 ? h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        h('div', { className: 'text-[0.68rem] uppercase tracking-wider text-wt-accent font-semibold mb-2' }, 'Enum Values'),
        h('div', { className: 'flex flex-wrap gap-1' },
          enums.map((e, i) => h('span', { key: i, className: 'enum-badge' }, e))
        )
      ) : null,

      h('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
        h('div', { className: 'text-[0.68rem] uppercase tracking-wider text-wt-muted font-semibold mb-1' }, 'Source'),
        h('code', { className: 'text-sm text-wt-file font-mono' }, entity.modelFile)
      )
    )
  );
}

function RelationshipPanel({ onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);
  return h('div', {
    className: 'fixed top-4 left-4 bottom-4 w-[520px] max-w-[92vw] z-40 bg-wt-surface border border-wt-border rounded-xl shadow-2xl flex flex-col overflow-hidden',
  },
    h('button', {
      onClick: onClose,
      className: 'absolute top-3 right-3 z-10 w-7 h-7 rounded-md border border-wt-border bg-wt-raised text-wt-muted flex items-center justify-center text-lg hover:bg-wt-red hover:border-wt-red hover:text-white transition-colors',
    }, '×'),
    h('div', { className: 'flex-1 overflow-y-auto p-6 prep-scroll' },
      h('h2', { className: 'text-xl font-bold text-wt-fg mb-1 pr-9' }, 'All Relationships'),
      h('p', { className: 'text-xs text-wt-muted mb-5' }, 'Every foreign key in the schema and what it means semantically.'),
      RELATIONSHIPS.map((r, i) => h('div', { key: i, className: 'mb-4 pb-3 border-b border-wt-border/50 last:border-0' },
        h('div', { className: 'flex items-center gap-2 mb-1' },
          h('span', { className: 'text-[0.85rem] font-bold text-wt-file' }, r.from),
          h('span', { className: 'text-[0.7rem] text-wt-muted' }, r.card),
          h('span', { className: 'text-[0.85rem] font-bold text-wt-file' }, r.to),
        ),
        h('div', { className: 'text-xs text-wt-accent font-medium mb-1' }, r.label),
        h('p', { className: 'text-[0.8rem] text-wt-muted leading-relaxed' }, r.detail),
      ))
    )
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// App
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [activeEntity, setActiveEntity] = useState(null);
  const [summaryCollapsed, setSummaryCollapsed] = useState(true);
  const [relPanelOpen, setRelPanelOpen] = useState(false);
  const pz = usePanZoom();

  const handleEntityClick = useCallback((key) => {
    if (ENTITIES[key]) setActiveEntity(key);
  }, []);

  const closeDetail = useCallback(() => setActiveEntity(null), []);

  useEffect(() => {
    const t = setTimeout(pz.fitToScreen, 800);
    return () => clearTimeout(t);
  }, [pz.fitToScreen]);

  return h(React.Fragment, null,
    h('header', { className: 'fixed top-0 inset-x-0 z-20 px-6 py-3.5 bg-gradient-to-b from-wt-bg via-wt-bg/90 to-transparent pointer-events-none' },
      h('h1', { className: 'text-base font-semibold text-wt-fg' }, 'TeamForge — Database Schema'),
      h('p', { className: 'text-sm text-wt-muted mt-0.5' }, '7 collections, 10 FK relationships — click any entity for field details')
    ),

    h('button', {
      onClick: () => setRelPanelOpen(true),
      className: 'fixed top-4 right-4 z-20 px-3.5 py-2 text-xs font-semibold rounded-lg border border-wt-accent/50 bg-wt-accent/15 text-wt-fg hover:bg-wt-accent/30 transition-colors',
    }, '🔗  All Relationships'),

    h('div', { ref: pz.viewportRef, className: 'fixed inset-0 overflow-hidden cursor-grab active:cursor-grabbing' },
      h('div', { ref: pz.canvasRef, className: 'origin-top-left' },
        h(MermaidDiagram, { onEntityClick: handleEntityClick })
      )
    ),

    h(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(c => !c) }),

    h('div', { className: 'fixed bottom-5 left-6 z-20 flex items-center gap-1.5' },
      h('button', { onClick: pz.zoomOut, className: 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised transition-colors' }, '−'),
      h('span', { ref: pz.zoomDisplayRef, className: 'px-2 text-xs text-wt-muted font-mono w-12 text-center' }, '100%'),
      h('button', { onClick: pz.zoomIn, className: 'w-8 h-8 rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised transition-colors' }, '+'),
      h('button', { onClick: pz.fitToScreen, className: 'ml-1 px-2.5 h-8 text-xs rounded-md border border-wt-border bg-wt-surface text-wt-muted hover:bg-wt-raised transition-colors' }, 'Fit')
    ),

    h('div', { className: 'fixed bottom-5 right-6 z-20 text-[0.65rem] text-wt-muted/60' },
      'scroll = zoom · drag = pan · click entity for fields'),

    activeEntity && ENTITIES[activeEntity]
      ? h(EntityDetailPanel, { entityKey: activeEntity, entity: ENTITIES[activeEntity], onClose: closeDetail })
      : null,

    relPanelOpen ? h(RelationshipPanel, { onClose: () => setRelPanelOpen(false) }) : null
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
